name: chuck_example
description: Demonstrates how to use the Chuck Interceptor plugin.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2
  chuck_interceptor:
    path: ../
  hive: ^2.2.3
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  material_ui: ^1.10.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
